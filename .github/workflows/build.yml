name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (Win7-compatible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm MosquitoMonitorTool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosquitoMonitorTool-windows
          path: dist/MosquitoMonitorTool.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MosquitoMonitorTool.exe
